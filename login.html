<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication | High Availability Architecture</title>
  <!-- AWS Cognito SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --input-bg: #0f172a;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #f87171;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .auth-header { text-align: center; margin-bottom: 1.5rem; }
    .auth-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-error { background: var(--error-bg); border: 1px solid var(--error-text); color: var(--error-text); }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-text); color: var(--success-text); }

    .tab-switch {
      display: flex;
      background: var(--input-bg);
      padding: 0.25rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 0.35rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--accent); color: #0b1120; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
    }
    .toggle-password svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      background: var(--accent);
      color: #0b1120;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:hover { background: var(--accent-hover); color: #fff; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1 id="form-title">Sign In</h1>
      <p id="form-subtitle">Enter your AWS Cognito credentials to proceed</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <div class="tab-switch">
      <button type="button" class="tab-btn active" id="signin-tab" onclick="switchMode('signin')">Sign In</button>
      <button type="button" class="tab-btn" id="signup-tab" onclick="switchMode('signup')">Sign Up</button>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password (Min. 8 characters)</label>
        <div class="input-wrapper">
          <input type="password" id="password" required minlength="8" placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    // ==========================================
    // PASTE YOUR CLOUDFORMATION OUTPUTS HERE:
    // ==========================================
    const POOL_DATA = {
      UserPoolId: 'us-east-1_aWk70DxhX', // e.g. us-east-1_Abc123Xyz
      ClientId: '75debm95lfmshc9m8ag2ggijcn'        // e.g. 1a2b3c4d5e6f7g8h9i0j
    };

    const userPool = new AmazonCognitoIdentity.CognitoUserPool(POOL_DATA);
    let mode = 'signin';

    // If already authenticated, redirect straight to dashboard
    if (localStorage.getItem('cognito_session')) {
      window.location.replace('index.html');
    }

    function switchMode(newMode) {
      mode = newMode;
      hideAlert();
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      const signinTab = document.getElementById('signin-tab');
      const signupTab = document.getElementById('signup-tab');
      const submitBtn = document.getElementById('submit-btn');

      if (mode === 'signup') {
        title.innerText = 'Create Account';
        subtitle.innerText = 'Registers your user directly into AWS Cognito';
        signinTab.classList.remove('active');
        signupTab.classList.add('active');
        submitBtn.innerText = 'Sign Up';
      } else {
        title.innerText = 'Sign In';
        subtitle.innerText = 'Enter your AWS Cognito credentials to proceed';
        signupTab.classList.remove('active');
        signinTab.classList.add('active');
        submitBtn.innerText = 'Sign In';
      }
    }

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    function showAlert(msg, isError) {
      const alertBox = document.getElementById('alert-box');
      alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert-box').style.display = 'none';
    }

    function handleAuth(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      if (mode === 'signup') {
        btn.innerText = 'Registering with AWS...';
        userPool.signUp(email, password, [], null, function(err, result) {
          btn.disabled = false;
          btn.innerText = 'Sign Up';
          if (err) {
            showAlert(err.message || 'Registration failed.', true);
            return;
          }
          showAlert('Account created & confirmed in AWS Cognito! Now Sign In.', false);
          switchMode('signin');
        });
      } else {
        btn.innerText = 'Authenticating with AWS...';
        const authenticationData = { Username: email, Password: password };
        const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);
        const userData = { Username: email, Pool: userPool };
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

        cognitoUser.authenticateUser(authenticationDetails, {
          onSuccess: function(result) {
            // Save real Cognito token
            localStorage.setItem('cognito_session', result.getAccessToken().getJwtToken());
            localStorage.setItem('cognito_user', email);
            window.location.replace('index.html');
          },
          onFailure: function(err) {
            btn.disabled = false;
            btn.innerText = 'Sign In';
            // REAL validation: Rejects wrong password with red alert
            showAlert(err.message || 'Incorrect email or password.', true);
          }
        });
      }
    }
  </script>
</body>
</html>
