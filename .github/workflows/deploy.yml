name: Deploy Custom Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS Systems Manager
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=ha-web-project-web-1,ha-web-project-web-2" \
            --parameters 'commands=["yum install -y git","rm -rf /tmp/repo-update","git clone https://github.com/rajesh01-hub/HA-Architecture-FrontEnd.git /tmp/repo-update","cp -r /tmp/repo-update/* /var/www/html/","chown -R apache:apache /var/www/html","chmod -R 755 /var/www/html","rm -rf /tmp/repo-update"]'
